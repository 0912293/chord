<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&display=swap">
<style>
:root{--bg:#f3f5f4;--ink:#1c2523;--mute:#5f6d69;--card:#fff;--line:#cfd8d5;--accent:#1f6f66;--ok:#2e8b57;--bad:#c0392b;--key:#fdfdfb;--black:#1c2523;--sel:#7fc8bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--ink:#e6eeec;--mute:#93a39e;--card:#1b2421;--line:#32403c;--accent:#4fb3a6;--ok:#4cc38a;--bad:#ef6b5b;--key:#e9eeec;--black:#0b0f0e;--sel:#3f9a8f}}
:root[data-theme="dark"]{--bg:#121816;--ink:#e6eeec;--mute:#93a39e;--card:#1b2421;--line:#32403c;--accent:#4fb3a6;--ok:#4cc38a;--bad:#ef6b5b;--key:#e9eeec;--black:#0b0f0e;--sel:#3f9a8f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
h1{font-size:1.3rem;margin:0;font-weight:600}h2{font-size:1.2rem;margin:0 0 12px}h3{font-size:1rem;margin:18px 0 0;color:var(--mute);font-weight:600}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
#staff{display:block;width:100%;max-width:760px;margin:0 auto}
#sym{min-height:1.6em;font-size:1.5rem;font-weight:600;text-align:center}
#msg{min-height:1.6em;margin-top:6px;font-size:1.05rem;color:var(--mute);text-align:center}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
button{font:inherit;font-size:.95rem;padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.big{font-size:1.1rem;padding:12px 28px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kbwrap{overflow-x:auto;margin-top:14px;padding-bottom:4px}
#kb{position:relative;height:170px;min-width:760px;display:flex;user-select:none;touch-action:manipulation}
.midi .kbwrap,.midi #clear{display:none}
.w{flex:1;background:var(--key);border:1px solid #9aa7a3;border-radius:0 0 5px 5px;cursor:pointer;position:relative}
.b{position:absolute;top:0;width:2.2%;height:62%;background:var(--black);border-radius:0 0 4px 4px;cursor:pointer;z-index:2;border:0}
.w.sel{background:var(--sel)}.b.sel{background:var(--accent)}
.w.good{background:var(--ok)}.b.good{background:var(--ok)}
.w.miss,.b.miss{background:var(--bad)}
.w.hint::after,.b.hint::after{content:"";position:absolute;left:50%;bottom:8px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--accent)}
.b.hint::after{bottom:14px;background:#fff}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:10px 14px;background:var(--card)}
legend{padding:0 6px;color:var(--mute);font-size:.9rem}
fieldset label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0;font-size:.95rem}
select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stats{display:flex;gap:22px;justify-content:center;margin-top:12px;color:var(--mute);font-size:.95rem}
.stats b{color:var(--ink)}
#cap{text-align:center;color:var(--mute);font-size:.95rem;margin-bottom:6px}
.err{color:var(--bad);text-align:center;min-height:1.4em;margin-top:8px}
.hintx{display:block;margin-top:6px;color:var(--mute);font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--mute);font-size:.9rem}
.c b{display:block;font-size:1.6rem;color:var(--ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px;background:var(--card);border:1px solid var(--line)}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th:nth-child(n+2),td:nth-child(n+2){text-align:right}
td:first-child{font-weight:600}
@media (orientation:landscape) and (max-height:540px){
main{padding-top:8px;padding-bottom:12px}h1{font-size:1.05rem}.top{margin-bottom:4px}
.stage{padding:8px 10px}#staff{max-height:44vh}#kb{height:max(90px,26vh)}.kbwrap{margin-top:6px}
.row{margin-top:6px}button{padding:6px 12px}
#msg{min-height:1.2em;margin-top:2px;font-size:.95rem}#sym{min-height:0;font-size:1.1rem}.stats{margin-top:6px}
}
</style>
</head>
<body>
<main>
<div class="top"><h1>Chord Trainer</h1><button id="quit" hidden>End session</button></div>

<section id="s-setup">
<fieldset><legend>Session</legend>
  <div><label><input type="radio" name="mode" value="types" checked> Chord types</label>
  <label><input type="radio" name="mode" value="scale"> Chords in a scale</label></div>
  <label>Questions <select id="qcount"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></label>
  <label>Chords on screen <select id="ahead"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
  <div><label><input type="radio" name="clef" value="treble" checked> Treble clef</label>
  <label><input type="radio" name="clef" value="bass"> Bass clef</label>
  <label><input type="radio" name="clef" value="mixed"> Mixed (random)</label></div>
</fieldset>
<fieldset id="f-types"><legend>Chord types</legend><div id="types"></div></fieldset>
<fieldset id="f-scale" hidden><legend>Scale</legend>
  <label>Root <select id="sroot"></select></label>
  <label>Scale <select id="sscale"></select></label>
  <label>Chords <select id="ssize"><option value="3">Triads</option><option value="4">Seventh chords</option><option value="both">Both</option></select></label>
</fieldset>
<fieldset><legend>Options</legend>
  <label><input type="checkbox" id="auto" checked> Check automatically when I press enough keys</label>
  <label><input type="checkbox" id="adv" checked> Go to the next chord when I get it right</label>
  <label><input type="checkbox" id="ign" checked> Ignore octave</label>
  <label><input type="checkbox" id="shown"> Show chord name</label>
  <label><input type="checkbox" id="sound" checked> Play sound</label>
</fieldset>
<fieldset><legend>MIDI keyboard</legend>
  <button id="midibtn">Use a MIDI keyboard</button> <span id="midistatus"></span>
  <span class="hintx">When a MIDI keyboard is connected, the on-screen keyboard is hidden and a wrong answer lets you try again.</span>
</fieldset>
<div class="row"><button class="primary big" id="start">Start session</button></div>
<div class="err" id="setupmsg"></div>
</section>

<section id="s-play" hidden>
<div class="stage">
  <div id="cap"></div>
  <div id="chord"></div>
  <div id="sym" aria-live="polite"></div>
  <div id="msg"></div>
  <div class="kbwrap"><div id="kb" aria-label="Piano keyboard"></div></div>
  <div class="row">
    <button class="primary" id="check">Check</button>
    <button id="clear">Clear keys</button>
    <button id="show">Show answer</button>
    <button id="next">Next chord</button>
  </div>
  <div class="stats"><span>Question <b id="qn">1</b> / <b id="qt">20</b></span><span>Wrong tries <b id="wr">0</b></span></div>
</div>
</section>

<section id="s-results" hidden>
  <h2 id="rtitle">Session complete</h2>
  <div class="cards" id="cards"></div>
  <h3>Chords, slowest to fastest</h3>
  <div class="tw"><table><thead><tr><th>Chord</th><th>Avg time</th><th>Seen</th><th>Wrong tries</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="row"><button class="primary" id="again">Practice again</button><button id="back">Back to settings</button></div>
</section>
</main>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var ROOTS=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
var ROOT_PC={"C":0,"Db":1,"D":2,"Eb":3,"E":4,"F":5,"F#":6,"G":7,"Ab":8,"A":9,"Bb":10,"B":11};
var TYPES=[
 {id:"maj",label:"Major",sym:"",iv:[0,4,7],on:true},
 {id:"min",label:"Minor",sym:"m",iv:[0,3,7],on:true},
 {id:"dim",label:"Diminished",sym:"dim",iv:[0,3,6],on:false},
 {id:"aug",label:"Augmented",sym:"aug",iv:[0,4,8],on:false},
 {id:"sus4",label:"Sus4",sym:"sus4",iv:[0,5,7],on:false},
 {id:"7",label:"Dominant 7",sym:"7",iv:[0,4,7,10],on:false},
 {id:"maj7",label:"Major 7",sym:"maj7",iv:[0,4,7,11],on:false},
 {id:"m7",label:"Minor 7",sym:"m7",iv:[0,3,7,10],on:false},
 {id:"m7b5",label:"Half-diminished",sym:"m7b5",iv:[0,3,6,10],on:false},
 {id:"dim7",label:"Diminished 7",sym:"dim7",iv:[0,3,6,9],on:false}
];
var START=36, WHITES=28, WPC=[0,2,4,5,7,9,11], BLACK_AFTER={0:1,1:3,3:6,4:8,5:10};
var kb=$("kb"), keyEls={}, selected={}, cur=null, done=false, waiting=false, ctx=null, advT, retryT, held={}, viaMidi=false;
var NS="http://www.w3.org/2000/svg", queue=[], N=4, GAP=80, X0=110, total=20, generated=0, rec=[], wrongTotal=0;
var SCALES=[
 {label:"Major (Ionian)",short:"major",iv:[0,2,4,5,7,9,11]},
 {label:"Dorian",short:"Dorian",iv:[0,2,3,5,7,9,10]},
 {label:"Phrygian",short:"Phrygian",iv:[0,1,3,5,7,8,10]},
 {label:"Lydian",short:"Lydian",iv:[0,2,4,6,7,9,11]},
 {label:"Mixolydian",short:"Mixolydian",iv:[0,2,4,5,7,9,10]},
 {label:"Natural minor (Aeolian)",short:"natural minor",iv:[0,2,3,5,7,8,10]},
 {label:"Locrian",short:"Locrian",iv:[0,1,3,5,6,8,10]},
 {label:"Harmonic minor",short:"harmonic minor",iv:[0,2,3,5,7,8,11]},
 {label:"Melodic minor (ascending)",short:"melodic minor",iv:[0,2,3,5,7,9,11]}
];
var QUAL={"0,4,7":"","0,3,7":"m","0,3,6":"dim","0,4,8":"aug","0,4,7,11":"maj7","0,4,7,10":"7","0,3,7,10":"m7","0,3,6,10":"m7b5","0,3,6,9":"dim7","0,3,7,11":"mMaj7","0,4,8,11":"maj7#5","0,4,8,10":"7#5"};
var RL=["C","C#","Db","D","D#","Eb","E","F","F#","Gb","G","G#","Ab","A","A#","Bb","B"], session=null;
function parse(n){ var l="CDEFGAB".indexOf(n[0]), a=0; for(var i=1;i<n.length;i++) a+=n[i]==="#"?1:-1; return {l:l,pc:(((NAT[l]+a)%12)+12)%12}; }
function disp(n){ return n[0]+n.slice(1).replace(/#/g,"\u266F").replace(/b/g,"\u266D"); }
var LET="CDEFGAB", NAT=[0,2,4,5,7,9,11], ACC={"1":"\u266F","2":"\u266F\u266F","-1":"\u266D","-2":"\u266D\u266D"};

function build(){
  for(var i=0;i<WHITES;i++){
    var oct=Math.floor(i/7), d=i%7, midi=START+oct*12+WPC[d];
    var el=document.createElement("div"); el.className="w"; el.dataset.m=midi; keyEls[midi]=el; kb.appendChild(el);
    if(BLACK_AFTER[d]!==undefined && i<WHITES-1){
      var b=document.createElement("div"); b.className="b"; b.dataset.m=midi+1; keyEls[midi+1]=b;
      b.style.left=((i+1)*100/WHITES-1.1)+"%"; kb.appendChild(b);
    }
  }
  var pd=null, wrap=kb.parentNode;
  kb.addEventListener("pointerdown",function(e){
    var t=e.target.closest("[data-m]");
    pd=t?{m:+t.dataset.m,x:e.clientX,y:e.clientY,s:wrap.scrollLeft}:null;
  });
  kb.addEventListener("pointerup",function(e){
    var p=pd; pd=null; if(!p) return;
    var t=e.target.closest("[data-m]");
    if(!t||+t.dataset.m!==p.m) return;
    if(Math.abs(e.clientX-p.x)>8||Math.abs(e.clientY-p.y)>8||Math.abs(wrap.scrollLeft-p.s)>2) return;
    viaMidi=false;
    if(waiting){ begin(); return; }
    toggle(p.m,true);
  });
  kb.addEventListener("pointercancel",function(){pd=null});
}
function beep(m){
  if(!$("sound").checked) return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=440*Math.pow(2,(m-69)/12);
    g.gain.setValueAtTime(.18,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.7);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.7);
  }catch(e){}
}
function toggle(m,sound){
  if(done||!cur) return;
  if(selected[m]) delete selected[m]; else { selected[m]=1; if(sound) beep(m); }
  paint();
  if($("auto").checked && Object.keys(selected).length>=cur.pcs.length) check();
}
function paint(){ for(var m in keyEls) keyEls[m].classList.toggle("sel",!!selected[m]); }
function clearKeys(){ for(var m in keyEls) keyEls[m].classList.remove("good","miss","hint"); }
function names(c){ return c.notes.map(function(x){return x.name}); }
function msg(t,c){ var m=$("msg"); m.textContent=t||""; m.className=c||""; }
function activeTypes(){ return TYPES.filter(function(t){return $("t_"+t.id).checked}); }
function showSym(on){ $("sym").textContent=(on||$("shown").checked)&&cur?cur.sym:""; }
function stats(){ $("qn").textContent=Math.min(rec.length+1,total); $("qt").textContent=total; $("wr").textContent=wrongTotal; }
function screen(n){ ["setup","play","results"].forEach(function(x){ $("s-"+x).hidden=x!==n; }); $("quit").hidden=n!=="play"; }

function spell(r,t,clef){
  var p=parse(r), li=p.l, rp=p.pc;
  var st=t.id==="sus4"?[0,3,4]:(t.iv.length===3?[0,2,4]:[0,2,4,6]);
  var lo=clef==="bass"?16:28, hi=lo+12-st[st.length-1], cand=[], out=[];
  for(var d=lo;d<=hi;d++) if(d%7===li) cand.push(d);
  var rd=cand[Math.floor(Math.random()*cand.length)];
  t.iv.forEach(function(iv,k){
    var dia=rd+st[k], l=dia%7, acc=((((rp+iv)%12)-NAT[l]+18)%12)-6;
    out.push({dia:dia,acc:acc,midi:12*(Math.floor(dia/7)+1)+NAT[l]+acc,name:LET[l]+(acc>0?"#".repeat(acc):"b".repeat(-acc))});
  });
  return out;
}
function chordSvg(c){
  var s="", ai=0, prev=null, pd=false, tr=c.clef==="treble", L;
  var Y=function(d){return 80-(d-30)*5};
  var ln=function(x,L){return '<line x1="'+(x-12)+'" x2="'+(x+12)+'" y1="'+L+'" y2="'+L+'" stroke="currentColor"/>'};
  c.notes.forEach(function(n){
    var y=Y(n.dia), disp=prev!==null&&n.dia-prev===1&&!pd, x=disp?12:0;
    pd=disp; prev=n.dia;
    if(tr){ for(L=30;L>=10;L-=10) if(y<=L) s+=ln(x,L); for(L=90;L<=110;L+=10) if(y>=L) s+=ln(x,L); }
    else { for(L=90;L>=70;L-=10) if(y<=L) s+=ln(x,L); for(L=150;L<=170;L+=10) if(y>=L) s+=ln(x,L); }
    s+='<ellipse cx="'+x+'" cy="'+y+'" rx="7" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>';
    if(n.acc){ s+='<text x="'+(-12-(ai%2)*(Math.abs(n.acc)>1?22:14))+'" y="'+(y+7)+'" text-anchor="end" font-size="24" fill="currentColor">'+ACC[n.acc]+'</text>'; ai++; }
  });
  return s;
}
function makeChord(){
  var mode=document.querySelector('input[name=clef]:checked').value;
  var clef=mode==="mixed"?(Math.random()<.5?"treble":"bass"):mode, t, r, k=0, sym;
  var last=queue.length?queue[queue.length-1].sym:"";
  var ts=activeTypes(); if(!ts.length) ts=[TYPES[0]];
  do{
    if(session&&session.mode==="scale"){
      var D=session.deg, i=Math.floor(Math.random()*7), sz=session.size==="both"?(Math.random()<.5?3:4):+session.size, iv=[];
      for(var j=0;j<sz;j++) iv.push((D[(i+2*j)%7].pc-D[i].pc+12)%12);
      var q=QUAL[iv.join(",")]; t={id:"x",iv:iv,sym:q===undefined?"?":q}; r=D[i].name;
    }else{
      t=ts[Math.floor(Math.random()*ts.length)]; r=ROOTS[Math.floor(Math.random()*12)];
    }
    sym=r+t.sym; k++;
  }while(last===sym&&k<20);
  var notes=spell(r,t,clef); generated++;
  return {sym:sym,clef:clef,notes:notes,pcs:notes.map(function(x){return x.midi%12}),wrong:0};
}
function buildStaff(){
  var W=X0+(N-1)*GAP+60, s="";
  [40,100].forEach(function(t){ for(var i=0;i<5;i++) s+='<line x1="10" x2="'+(W-10)+'" y1="'+(t+i*10)+'" y2="'+(t+i*10)+'" stroke="currentColor"/>'; });
  s+='<line x1="10" x2="10" y1="40" y2="140" stroke="currentColor" stroke-width="2"/><path d="M8 40Q-2 90 8 140" fill="none" stroke="currentColor" stroke-width="3"/>';
  var ff='font-size="40" font-family="\'Noto Music\',\'Bravura Text\',serif" fill="currentColor"';
  s+='<text x="16" y="80.5" '+ff+'>\u{1D11E}</text><text x="16" y="136" '+ff+'>\u{1D122}</text><g id="cg"></g>';
  $("chord").innerHTML='<svg id="staff" viewBox="0 20 '+W+' 150" role="img" aria-label="Upcoming chords on a grand staff">'+s+'</svg>';
}
function mkG(c,slot){
  var g=document.createElementNS(NS,"g");
  g.innerHTML=chordSvg(c);
  g.style.transform="translateX("+(X0+slot*GAP)+"px)";
  g.style.transition="transform .4s ease,opacity .4s ease"; g.style.opacity=0;
  c.el=g; $("cg").appendChild(g);
}
function layout(){
  $("cg").getBoundingClientRect();
  queue.forEach(function(c,i){ c.el.style.transform="translateX("+(X0+i*GAP)+"px)"; c.el.style.opacity=1; });
}

function startSession(){
  var md=document.querySelector('input[name=mode]:checked').value;
  if(md==="types"&&!activeTypes().length){ $("setupmsg").textContent="Pick at least one chord type."; return; }
  $("setupmsg").textContent="";
  session={mode:md,size:$("ssize").value,label:"",cap:"",deg:null};
  if(md==="scale"){
    var rn=$("sroot").value, sc=SCALES[+$("sscale").value];
    if(rn==="random") rn=ROOTS[Math.floor(Math.random()*12)];
    var pr=parse(rn);
    session.deg=sc.iv.map(function(st,i){ var l=(pr.l+i)%7, pc=(pr.pc+st)%12, a=((pc-NAT[l]+18)%12)-6; return {pc:pc,name:LET[l]+(a>0?"#".repeat(a):"b".repeat(-a))}; });
    session.label=disp(rn)+" "+sc.short;
    session.cap="Chords in "+session.label+": "+session.deg.map(function(d){return disp(d.name)}).join(" ");
  }
  clearTimeout(advT); clearTimeout(retryT);
  total=+$("qcount").value; N=Math.min(+$("ahead").value,total);
  generated=0; rec=[]; wrongTotal=0; queue=[]; cur=null; selected={}; held={}; done=false; waiting=true;
  clearKeys(); paint(); screen("play"); $("cap").textContent=session.cap; buildStaff(); showSym(false); msg("Play any key to start the session"); stats();
  window.scrollTo(0,0);
}
function begin(){
  waiting=false; msg("");
  for(var i=0;i<N;i++) queue.push(makeChord());
  queue.forEach(function(c,i){ mkG(c,i); });
  cur=queue[0]; cur.t0=performance.now(); layout(); showSym(false);
}
function record(skip){
  if(!cur||cur.rec) return;
  cur.rec=true; rec.push({sym:cur.sym,ms:performance.now()-cur.t0,wrong:cur.wrong,skip:skip}); stats();
}
function next(){
  clearTimeout(advT); clearTimeout(retryT);
  if(!queue.length){ showResults(); return; }
  var old=queue.shift();
  old.el.style.transform="translateX("+(X0-GAP)+"px)"; old.el.style.opacity=0;
  setTimeout(function(){ if(old.el.parentNode) old.el.parentNode.removeChild(old.el); },450);
  if(generated<total){ var c=makeChord(); queue.push(c); mkG(c,N); }
  selected={}; done=false; clearKeys(); paint(); showSym(false); msg("");
  if(!queue.length){ cur=null; done=true; stats(); setTimeout(showResults,500); return; }
  cur=queue[0]; cur.t0=performance.now(); layout(); stats();
}
function skip(){ if(waiting||!cur) return; record(true); next(); }
function reveal(){ cur.notes.forEach(function(n){ var el=keyEls[n.midi]; if(el) el.classList.add("hint"); }); }

function check(){
  if(!cur||done||waiting) return;
  var ign=$("ign").checked, key=function(m){return ign?m%12:+m}, want={}, got={};
  cur.notes.forEach(function(n){want[key(n.midi)]=1});
  Object.keys(selected).forEach(function(m){got[key(m)]=1});
  var wk=Object.keys(want), gk=Object.keys(got);
  var ok=gk.length===wk.length && gk.every(function(k){return want[k]});
  done=true;
  Object.keys(selected).forEach(function(m){ keyEls[m].classList.add(want[key(m)]?"good":"miss"); });
  var heads=cur.el.querySelectorAll("ellipse");
  cur.notes.forEach(function(n,i){ heads[i].style.stroke=got[key(n.midi)]?"var(--ok)":"var(--bad)"; });
  var retry=viaMidi&&!ok;
  if(!retry) showSym(true);
  if(ok){
    cur.el.style.color="var(--ok)"; record(false);
    msg("Correct. "+cur.sym+": "+names(cur).join(" \u2013 "),"ok");
    if($("adv").checked) advT=setTimeout(next,700);
  }else{
    cur.wrong++; wrongTotal++; stats();
    if(retry){
      msg("Not quite. Try again.","bad");
      retryT=setTimeout(function(){
        if(!cur||waiting) return;
        clearKeys(); cur.el.querySelectorAll("ellipse").forEach(function(e){ e.style.stroke=""; });
        selected={}; done=false; paint(); msg("");
      },900);
    }else{
      var missing=cur.notes.filter(function(n){return !got[key(n.midi)]}).map(function(n){return n.name});
      msg("Not quite. "+(missing.length?"Missing "+missing.join(", ")+". ":"")+cur.sym+": "+names(cur).join(" \u2013 "),"bad");
      reveal();
    }
  }
}

function fmt(ms){ var s=ms/1000; return s<60?s.toFixed(1)+" s":Math.floor(s/60)+":"+("0"+Math.round(s%60)).slice(-2); }
function showResults(){
  clearTimeout(advT); clearTimeout(retryT); waiting=false;
  var okr=rec.filter(function(r){return !r.skip});
  var sum=function(a){return a.reduce(function(x,r){return x+r.ms},0)};
  var first=okr.filter(function(r){return !r.wrong}).length;
  var g={};
  rec.forEach(function(r){
    var o=g[r.sym]||(g[r.sym]={sym:r.sym,n:0,t:0,c:0,w:0,sk:0});
    o.n++; o.w+=r.wrong; if(r.skip) o.sk++; else { o.t+=r.ms; o.c++; }
  });
  var rows=Object.keys(g).map(function(k){ var o=g[k]; o.avg=o.c?o.t/o.c:Infinity; return o; })
    .sort(function(a,b){ return a.avg===b.avg?0:(b.avg>a.avg?1:-1); });
  $("rtitle").textContent=(rec.length<total?"Session ended early":"Session complete")+(session&&session.label?" \u00B7 "+session.label:"");
  $("cards").innerHTML=
    '<div class="c"><b>'+rec.length+(rec.length<total?" / "+total:"")+'</b>chords</div>'+
    '<div class="c"><b>'+(okr.length?fmt(sum(okr)/okr.length):"\u2013")+'</b>average per chord</div>'+
    '<div class="c"><b>'+first+" / "+rec.length+'</b>right first try</div>'+
    '<div class="c"><b>'+fmt(sum(rec))+'</b>total time</div>';
  $("rows").innerHTML=rows.map(function(o){
    var t=o.c?fmt(o.avg)+(o.sk?" (+"+o.sk+" skipped)":""):"skipped";
    return "<tr><td>"+o.sym+"</td><td>"+t+"</td><td>"+o.n+"</td><td>"+o.w+"</td></tr>";
  }).join("");
  screen("results"); window.scrollTo(0,0);
}

// midi
function onMsg(ev){
  var st=ev.data[0]&0xf0, note=ev.data[1], vel=ev.data[2];
  if($("s-play").hidden) return;
  if(st===0x90&&vel>0){
    viaMidi=true;
    if(waiting){ begin(); return; }
    if(done||!cur) return;
    var m=note; while(m<START)m+=12; while(m>=START+48)m-=12;
    selected[m]=1; held[note]=m; paint();
    if($("auto").checked && Object.keys(selected).length>=cur.pcs.length) check();
  }else if(st===0x80||(st===0x90&&vel===0)){
    if(!done&&held[note]!==undefined){ delete selected[held[note]]; delete held[note]; paint(); }
  }
}
function connectMidi(){
  var s=$("midistatus");
  if(!navigator.requestMIDIAccess){ s.textContent="This browser has no MIDI support. Open the link in Chrome."; return; }
  function attach(a){
    var n=0; a.inputs.forEach(function(inp){ n++; inp.onmidimessage=onMsg; });
    document.body.classList.toggle("midi",n>0);
    s.textContent=n?"Connected: "+n+" input"+(n>1?"s":"")+".":"No MIDI keyboard found. Plug it in and it will connect automatically.";
  }
  navigator.requestMIDIAccess().then(function(a){ attach(a); a.onstatechange=function(){ attach(a); }; })
  .catch(function(){ s.textContent="MIDI is blocked here. Open this page in Chrome itself (not inside another app) and allow MIDI access."; });
}

// wiring
var tw=$("types");
TYPES.forEach(function(t){
  var l=document.createElement("label");
  l.innerHTML='<input type="checkbox" id="t_'+t.id+'"'+(t.on?" checked":"")+'> '+t.label; tw.appendChild(l);
});
$("sroot").innerHTML=RL.map(function(n){return '<option value="'+n+'">'+disp(n)+'</option>'}).join("")+'<option value="random">Random root (per session)</option>';
$("sscale").innerHTML=SCALES.map(function(x,i){return '<option value="'+i+'">'+x.label+'</option>'}).join("");
document.querySelectorAll('input[name=mode]').forEach(function(r){ r.onchange=function(){ var sc=document.querySelector('input[name=mode]:checked').value==="scale"; $("f-types").hidden=sc; $("f-scale").hidden=!sc; }; });
$("start").onclick=startSession; $("again").onclick=startSession;
$("back").onclick=function(){ screen("setup"); };
$("quit").onclick=function(){ clearTimeout(advT); clearTimeout(retryT); if(rec.length) showResults(); else { waiting=false; screen("setup"); } };
$("check").onclick=function(){ viaMidi=false; check(); };
$("clear").onclick=function(){ if(done||waiting) return; selected={}; paint(); };
$("next").onclick=skip;
$("show").onclick=function(){ if(!cur||waiting) return; done=true; reveal(); showSym(true); msg(cur.sym+": "+names(cur).join(" \u2013 "),"bad"); };
$("midibtn").onclick=connectMidi;
document.addEventListener("keydown",function(e){
  var tg=e.target.tagName;
  if(e.key!=="Enter"||tg==="INPUT"||tg==="BUTTON"||tg==="SELECT"||$("s-play").hidden) return;
  if(waiting) begin(); else if(cur){ if(done) skip(); else check(); }
});
build();
try{ navigator.permissions.query({name:"midi"}).then(function(p){ if(p.state==="granted") connectMidi(); }).catch(function(){}); }catch(e){}
window.__t=window.__T&&{cur:function(){return cur},rec:function(){return rec}};
})();
</script>
